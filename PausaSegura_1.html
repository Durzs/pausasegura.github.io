<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
const {
  Shield, ShieldCheck, PhoneIncoming, PhoneOff, Phone, MessageSquare,
  AlertTriangle, CheckCircle2, Flag, Users, Lightbulb, ChevronLeft,
  HeartHandshake, Send, Volume2, VolumeX
} = LucideReact;
// Tone ya es global (UMD)


/* ============================================================
   PAUSA SEGURA — Demo de pitch con flujo animado
   · Onboarding con dos simulaciones: llamada y mensaje
   · Camino social: "Pedir ayuda a un familiar"
   · Momento de bloqueo cinematográfico (escudo que se dibuja)
   · Transiciones direccionales con curva tipo spring
   · Contador animado del efecto de red
   Accesibilidad: texto ≥19px, botones ≥56px, alto contraste,
   color + texto siempre, prefers-reduced-motion respetado.
   Estado en memoria (useState). Sin localStorage.
   ============================================================ */

const T = {
  tinta: "#15232C",
  tintaSuave: "#46585F",
  fondo: "#FBFCFB",
  fondoSuave: "#F1F6F4",
  acento: "#0C6E62",
  acentoOscuro: "#084F46",
  acentoGrad: "linear-gradient(180deg, #0E7A6D 0%, #0A5C51 100%)",
  peligro: "#B3261E",
  peligroGrad: "linear-gradient(180deg, #C42B20 0%, #9E1B14 100%)",
  peligroFondo: "#FBEAE8",
  cuidado: "#5F4900",
  cuidadoFondo: "#FFF3C8",
  ok: "#0E7A3D",
  okGrad: "linear-gradient(180deg, #15914B 0%, #0B6630 100%)",
  okFondo: "#E9F5EE",
  borde: "#D4DEDA",
  sombraCard: "0 2px 10px rgba(21,35,44,0.08)",
};

const F_APP = "'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif";
const F_DEMO = "'Sora', 'Segoe UI', system-ui, sans-serif";

const NUM_ESTAFA = "+56 9 4421 8137";
const ENLACE_FALSO = "banco‑seguro‑chile.com";

const CONTACTOS = [
  { id: "carmen", nombre: "Carmen", relacion: "tu hija", inicial: "C", color: "#7C3AED" },
  { id: "mateo", nombre: "Mateo", relacion: "tu nieto", inicial: "M", color: "#0B57D0" },
];

const reduceMotion = () =>
  typeof window !== "undefined" &&
  window.matchMedia &&
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- UI básica ---------------- */

function BotonGrande({ children, onClick, variante = "principal", icono: Icono, deshabilitado = false }) {
  const estilos = {
    principal: { background: T.acentoGrad, color: "#FFF", border: "none", boxShadow: "0 3px 10px rgba(12,110,98,0.35)" },
    seguro: { background: T.okGrad, color: "#FFF", border: "none", boxShadow: "0 3px 10px rgba(14,122,61,0.35)" },
    peligro: { background: T.peligroGrad, color: "#FFF", border: "none", boxShadow: "0 3px 10px rgba(179,38,30,0.35)" },
    secundario: { background: "#FFF", color: T.acentoOscuro, border: "3px solid " + T.acento, boxShadow: T.sombraCard },
    discreto: { background: "#FFF", color: T.tintaSuave, border: "2px solid " + T.borde, boxShadow: "none" },
  }[variante];

  return (
    <button
      onClick={deshabilitado ? undefined : onClick}
      disabled={deshabilitado}
      className="ps-boton"
      style={{
        ...estilos,
        width: "100%",
        minHeight: variante === "discreto" ? 56 : 64,
        borderRadius: 16,
        fontSize: variante === "discreto" ? 20 : 22,
        fontWeight: 700,
        fontFamily: F_APP,
        cursor: deshabilitado ? "not-allowed" : "pointer",
        opacity: deshabilitado ? 0.45 : 1,
        padding: "12px 16px",
        lineHeight: 1.25,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        gap: 10,
      }}
    >
      {Icono && <Icono size={26} strokeWidth={2.4} aria-hidden="true" />}
      <span>{children}</span>
    </button>
  );
}

function Tarjeta({ children, tono = "neutra", style, className }) {
  const tonos = {
    neutra: { background: "#FFF", border: "2px solid " + T.borde },
    ok: { background: T.okFondo, border: "3px solid " + T.ok },
    peligro: { background: T.peligroFondo, border: "2px solid " + T.peligro },
    cuidado: { background: T.cuidadoFondo, border: "2px solid #C9A227" },
    suave: { background: T.fondoSuave, border: "2px solid " + T.borde },
  }[tono];
  return (
    <div className={className} style={{ ...tonos, borderRadius: 16, padding: 16, boxShadow: T.sombraCard, ...style }}>
      {children}
    </div>
  );
}

function Progreso({ paso, titulo }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 18px", background: T.fondoSuave, borderBottom: "2px solid " + T.borde }}>
      <span style={{ fontSize: 19, fontWeight: 700, color: T.tintaSuave }}>
        {titulo} · Paso {paso} de 3
      </span>
      <span style={{ display: "flex", gap: 6 }} aria-hidden="true">
        {[1, 2, 3].map((n) => (
          <span
            key={n}
            style={{
              width: n === paso ? 26 : 10,
              height: 10,
              borderRadius: 999,
              background: n <= paso ? T.acento : T.borde,
              transition: "width .35s cubic-bezier(.22,1.2,.36,1), background .25s ease",
            }}
          />
        ))}
      </span>
    </div>
  );
}

/* Contador animado para el efecto de red */
function ContadorRed({ objetivo }) {
  const [valor, setValor] = useState(reduceMotion() ? objetivo : Math.max(0, objetivo - 60));
  useEffect(() => {
    if (reduceMotion()) return;
    const inicio = performance.now();
    const desde = Math.max(0, objetivo - 60);
    const dur = 1100;
    let raf;
    const tick = (t) => {
      const p = Math.min(1, (t - inicio) / dur);
      const suave = 1 - Math.pow(1 - p, 3); // ease-out cúbico
      setValor(Math.round(desde + (objetivo - desde) * suave));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [objetivo]);
  return <>{valor.toLocaleString("es-CL")}</>;
}

/* Escudo SVG que se dibuja (momento de bloqueo) */
function EscudoAnimado() {
  return (
    <svg width="150" height="164" viewBox="0 0 100 110" fill="none" aria-hidden="true">
      <path
        className="ps-draw-escudo"
        d="M50 6 L90 22 V52 C90 80 72 98 50 106 C28 98 10 80 10 52 V22 Z"
        stroke="#FFFFFF"
        strokeWidth="5"
        strokeLinejoin="round"
      />
      <path
        className="ps-draw-check"
        d="M31 56 L45 70 L71 40"
        stroke="#7CF5C8"
        strokeWidth="8"
        strokeLinecap="round"
        strokeLinejoin="round"
      />
    </svg>
  );
}

function Franja({ fondo, colorTexto, icono: Icono, titulo, subtitulo, vibrar }) {
  return (
    <div
      role="alert"
      style={{
        background: fondo,
        color: colorTexto,
        padding: "24px 18px 20px",
        textAlign: "center",
        boxShadow: "inset 0 -4px 0 rgba(0,0,0,0.18)",
      }}
    >
      <span style={{ position: "relative", display: "inline-flex", padding: 14 }}>
        {vibrar && (
          <>
            <span className="ps-onda" style={{ animationDelay: "0s" }} />
            <span className="ps-onda" style={{ animationDelay: "0.6s" }} />
            <span className="ps-onda" style={{ animationDelay: "1.2s" }} />
          </>
        )}
        <span className={vibrar ? "ps-vibrar" : ""} style={{ display: "inline-flex" }}>
          <Icono size={58} strokeWidth={2.2} aria-hidden="true" />
        </span>
      </span>
      <div style={{ fontSize: 26, fontWeight: 800, marginTop: 8, letterSpacing: -0.3 }}>{titulo}</div>
      <div style={{ fontSize: 21, marginTop: 6, opacity: 0.95 }}>{subtitulo}</div>
    </div>
  );
}

/* ============================================================ */

function PausaSeguraFlow() {
  const [pantalla, setPantalla] = useState("inicio");
  const [dir, setDir] = useState("fwd"); // fwd | back
  const [protegidas, setProtegidas] = useState(1240); // CIFRA DE EJEMPLO
  const [origen, setOrigen] = useState("llamada"); // de dónde viene el camino familiar
  const [contacto, setContacto] = useState(CONTACTOS[0]);
  const [sonido, setSonido] = useState(true); // tono de alerta audible
  const audioRef = useRef({ synth: null, loop: null, voz: null });

  /* --- Voz: anuncia el peligro en español (síntesis del navegador) --- */
  const elegirVozEs = () => {
    const voces = window.speechSynthesis?.getVoices?.() || [];
    return (
      voces.find((v) => v.lang === "es-CL") ||
      voces.find((v) => v.lang && v.lang.startsWith("es")) ||
      null
    );
  };

  const hablar = (texto) => {
    if (!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(texto);
    const voz = elegirVozEs();
    if (voz) u.voice = voz;
    u.lang = (voz && voz.lang) || "es-CL";
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  };

  const hablarAlerta = () => hablar("¡Peligro! Posible estafa.");

  /* --- Tono de alerta: tritono urgente en loop (Tone.js) --- */
  const detenerTonoPeligro = () => {
    const a = audioRef.current;
    if (a.voz) clearInterval(a.voz);
    if (a.loop) a.loop.dispose();
    if (a.synth) a.synth.dispose();
    try {
      Tone.Transport.stop();
      Tone.Transport.cancel();
    } catch (e) {}
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    audioRef.current = { synth: null, loop: null, voz: null };
  };

  const iniciarTonoPeligro = async (forzar = false) => {
    if (!sonido && !forzar) return;
    try {
      await Tone.start(); // requiere gesto del usuario: el clic del botón lo es
      detenerTonoPeligro();
      const synth = new Tone.Synth({
        oscillator: { type: "triangle" },
        envelope: { attack: 0.005, decay: 0.12, sustain: 0.15, release: 0.08 },
      }).toDestination();
      synth.volume.value = -10; // volumen moderado: alerta, no sobresalto
      const loop = new Tone.Loop((time) => {
        // sol–mi♭–sol: intervalo disonante, reconocible como "alarma"
        synth.triggerAttackRelease("G5", "16n", time);
        synth.triggerAttackRelease("Eb5", "16n", time + 0.18);
        synth.triggerAttackRelease("G5", "16n", time + 0.36);
      }, 1.15).start(0);
      Tone.Transport.start();
      hablarAlerta();
      const voz = setInterval(hablarAlerta, 3400);
      audioRef.current = { synth, loop, voz };
    } catch (e) {
      /* audio no disponible: la alerta visual y textual siguen funcionando */
    }
  };

  /* --- Chime de éxito al bloquear (sincronizado con el escudo) --- */
  const chimeBloqueo = () => {
    if (!sonido) return;
    try {
      const s = new Tone.Synth({ oscillator: { type: "sine" } }).toDestination();
      s.volume.value = -8;
      const t = Tone.now();
      const d = reduceMotion() ? 0.1 : 0.85; // coincide con el trazo del check
      s.triggerAttackRelease("C5", "8n", t + d);
      s.triggerAttackRelease("G5", "4n", t + d + 0.2);
      setTimeout(() => s.dispose(), 3000);
    } catch (e) {}
  };

  /* El tono solo suena mientras está visible la llamada entrante.
     (mensaje-2 maneja su propia voz: no se cancela aquí) */
  useEffect(() => {
    if (pantalla !== "llamada-1" && pantalla !== "mensaje-2") detenerTonoPeligro();
    return detenerTonoPeligro;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pantalla]);

  /* --- Pausa deliberativa de 7 s en el flujo de mensaje --- */
  const [cuenta, setCuenta] = useState(7);
  useEffect(() => {
    if (pantalla !== "mensaje-2") return;
    setCuenta(7);
    let v;
    if (sonido) {
      v = setTimeout(
        () => hablar("¡Cuidado! Enlace peligroso. Respira. Tienes siete segundos para decidir con calma."),
        250
      );
    }
    const int = setInterval(() => setCuenta((c) => Math.max(0, c - 1)), 1000);
    return () => {
      clearInterval(int);
      clearTimeout(v);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pantalla]);

  /* Silenciar detiene todo de inmediato */
  useEffect(() => {
    if (!sonido) detenerTonoPeligro();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [sonido]);

  const ir = (p, d = "fwd") => {
    setDir(d);
    setPantalla(p);
  };

  const reportar = (destino) => {
    setProtegidas((n) => n + 1);
    ir(destino);
  };

  /* Interstitial de bloqueo: avanza solo tras la animación (+ voz de calma) */
  useEffect(() => {
    const espera = reduceMotion() ? 500 : 1900;
    let t, v;
    if (pantalla === "bloqueo-llamada") {
      t = setTimeout(() => ir("llamada-2"), espera);
      if (sonido) v = setTimeout(() => hablar("Llamada bloqueada. Estás a salvo."), 300);
    }
    if (pantalla === "bloqueo-mensaje") {
      t = setTimeout(() => reportar("mensaje-3"), espera);
      if (sonido) v = setTimeout(() => hablar("Enlace bloqueado. Estás a salvo."), 300);
    }
    return () => {
      clearTimeout(t);
      clearTimeout(v);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pantalla]);

  /* ============================ Pantallas ============================ */

  const pantallas = {
    /* ---------- INICIO / ONBOARDING ---------- */
    inicio: (
      <div style={{ padding: 22, display: "flex", flexDirection: "column", gap: 16, height: "100%", justifyContent: "center" }}>
        <div style={{ textAlign: "center" }} className="ps-stagger" data-i="1">
          <span
            style={{
              width: 76, height: 76, borderRadius: 22, background: T.acentoGrad,
              display: "inline-flex", alignItems: "center", justifyContent: "center",
              color: "#FFF", boxShadow: "0 6px 18px rgba(12,110,98,0.4)",
            }}
            aria-hidden="true"
          >
            <Shield size={44} strokeWidth={2.2} />
          </span>
          <h1 style={{ fontSize: 30, margin: "14px 0 0", color: T.acentoOscuro, letterSpacing: -0.5 }}>
            Pausa Segura
          </h1>
          <p style={{ fontSize: 21, margin: "8px 0 0", color: T.tintaSuave }}>
            Te ayuda a detenerte antes de caer en una estafa.
          </p>
        </div>

        <Tarjeta tono="suave" className="ps-stagger" data-i="2">
          <p style={{ fontSize: 19, margin: 0, color: T.tinta, display: "flex", gap: 10 }}>
            <Users size={26} color={T.acento} strokeWidth={2.4} aria-hidden="true" style={{ flexShrink: 0, marginTop: 2 }} />
            <span>
              Cuando otras personas reportan un número o un enlace, la app{" "}
              <strong>te avisa antes</strong> de que contestes o lo abras.
            </span>
          </p>
        </Tarjeta>

        <p className="ps-stagger" data-i="3" style={{ fontSize: 21, margin: "2px 0 0", color: T.tinta, fontWeight: 700, textAlign: "center" }}>
          Prueba cómo funciona:
        </p>

        <div className="ps-stagger" data-i="4" style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <BotonGrande
            variante="peligro"
            icono={PhoneIncoming}
            onClick={() => {
              iniciarTonoPeligro();
              ir("llamada-1");
            }}
          >
            Simular llamada de estafa
          </BotonGrande>
          <BotonGrande icono={MessageSquare} onClick={() => ir("mensaje-1")}>
            Simular mensaje con enlace falso
          </BotonGrande>
        </div>
      </div>
    ),

    /* ================= FLUJO A · LLAMADA ================= */

    "llamada-1": (
      <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
        <Progreso paso={1} titulo="Llamada" />
        <Franja
          fondo={T.peligroGrad}
          colorTexto="#FFF"
          icono={PhoneIncoming}
          titulo="Llamada peligrosa"
          subtitulo="Reportada como estafa por otros usuarios"
          vibrar
        />
        <div style={{ padding: 20, display: "flex", flexDirection: "column", gap: 14, flex: 1, justifyContent: "center" }}>
          <p style={{ fontSize: 19, margin: 0, color: T.tintaSuave, textAlign: "center" }}>Te está llamando:</p>
          <p style={{ fontSize: 30, fontWeight: 800, margin: 0, color: T.tinta, textAlign: "center", letterSpacing: 1 }}>
            {NUM_ESTAFA}
          </p>

          {/* Equivalente textual del anuncio sonoro (accesibilidad multimodal) */}
          <p
            style={{
              fontSize: 19,
              margin: 0,
              color: T.peligro,
              fontWeight: 700,
              textAlign: "center",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: 8,
            }}
          >
            {sonido ? (
              <Volume2 size={24} strokeWidth={2.4} aria-hidden="true" className="ps-vibrar" />
            ) : (
              <VolumeX size={24} strokeWidth={2.4} aria-hidden="true" />
            )}
            <span>
              {sonido ? "El teléfono anuncia: «¡Peligro! Posible estafa»" : "Tono de alerta silenciado"}
            </span>
          </p>

          <BotonGrande
            variante="seguro"
            icono={PhoneOff}
            onClick={() => {
              detenerTonoPeligro();
              chimeBloqueo();
              ir("bloqueo-llamada");
            }}
          >
            Colgar (opción segura)
          </BotonGrande>
          <BotonGrande
            variante="secundario"
            icono={HeartHandshake}
            onClick={() => {
              setOrigen("llamada");
              ir("familiar-1");
            }}
          >
            Pedir ayuda a un familiar
          </BotonGrande>
          <BotonGrande variante="discreto" icono={Phone} onClick={() => ir("llamada-2")}>
            Contestar igual
          </BotonGrande>
          <BotonGrande
            variante="discreto"
            icono={sonido ? VolumeX : Volume2}
            onClick={() => {
              if (sonido) {
                setSonido(false);
              } else {
                setSonido(true);
                iniciarTonoPeligro(true);
              }
            }}
          >
            {sonido ? "Silenciar tono de alerta" : "Activar tono de alerta"}
          </BotonGrande>
        </div>
      </div>
    ),

    /* Interstitial — momento de bloqueo (llamada) */
    "bloqueo-llamada": (
      <div className="ps-bloqueo" role="status" aria-live="polite">
        <EscudoAnimado />
        <p className="ps-bloqueo-texto" style={{ fontSize: 27, fontWeight: 800, margin: "18px 0 0" }}>
          Llamada bloqueada
        </p>
        <p className="ps-bloqueo-texto" style={{ fontSize: 21, margin: "8px 0 0", opacity: 0.9 }}>
          Estás a salvo
        </p>
      </div>
    ),

    "llamada-2": (
      <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
        <Progreso paso={2} titulo="Llamada" />
        <div style={{ padding: 20, display: "flex", flexDirection: "column", gap: 16, flex: 1, justifyContent: "center", textAlign: "center" }}>
          <span className="ps-stagger" data-i="1" style={{ alignSelf: "center", color: T.ok }} aria-hidden="true">
            <ShieldCheck size={72} strokeWidth={2} />
          </span>
          <h1 className="ps-stagger" data-i="2" style={{ fontSize: 26, margin: 0, color: T.ok, letterSpacing: -0.3 }}>
            Llamada terminada
          </h1>
          <p className="ps-stagger" data-i="2" style={{ fontSize: 22, margin: 0, color: T.tinta }}>
            No entregaste ningún dato.
          </p>
          <Tarjeta tono="suave" className="ps-stagger" style={{ textAlign: "center" }} data-i="3">
            <p style={{ fontSize: 19, margin: 0, color: T.tintaSuave }}>Número:</p>
            <p style={{ fontSize: 25, fontWeight: 800, margin: "4px 0 0", color: T.tinta, letterSpacing: 1 }}>
              {NUM_ESTAFA}
            </p>
          </Tarjeta>
          <div className="ps-stagger" data-i="4" style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <BotonGrande variante="peligro" icono={Flag} onClick={() => reportar("llamada-3")}>
              Reportar este número como estafa
            </BotonGrande>
            <p style={{ fontSize: 19, margin: 0, color: T.tintaSuave }}>Un solo toque. Sin formularios.</p>
          </div>
        </div>
      </div>
    ),

    "llamada-3": (
      <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
        <Progreso paso={3} titulo="Llamada" />
        <div style={{ padding: 20, display: "flex", flexDirection: "column", gap: 16, flex: 1, justifyContent: "center", textAlign: "center" }}>
          <span className="ps-pop" style={{ alignSelf: "center", color: T.ok }} aria-hidden="true">
            <CheckCircle2 size={80} strokeWidth={2} />
          </span>
          <h1 className="ps-stagger" data-i="2" style={{ fontSize: 27, margin: 0, color: T.ok, letterSpacing: -0.3 }}>¡Gracias!</h1>
          <p className="ps-stagger" data-i="2" style={{ fontSize: 22, margin: 0, color: T.tinta }}>
            Tu aviso le enseñó a la app a reconocer este número.
          </p>
          <Tarjeta tono="ok" className="ps-stagger" data-i="3">
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, color: T.ok }}>
              <Users size={30} strokeWidth={2.4} aria-hidden="true" />
              <span style={{ fontSize: 46, fontWeight: 800, lineHeight: 1.1 }}>
                <ContadorRed objetivo={protegidas} />
              </span>
            </div>
            <div style={{ fontSize: 21, color: T.tinta, marginTop: 4 }}>
              personas ahora están protegidas de este número
            </div>
            <div style={{ fontSize: 19, color: T.tintaSuave, marginTop: 6, fontStyle: "italic" }}>
